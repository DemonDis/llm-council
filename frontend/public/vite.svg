<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Орбита обсуждения (внешнее кольцо) -->
  <circle cx="50" cy="50" r="32" stroke="#e2e8f0" stroke-width="3" fill="none"/>
  
  <!-- Линии связи к центру (передача мыслей/данных) -->
  <line x1="50" y1="18" x2="50" y2="36" stroke="#4a90e2" stroke-width="2" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="82" y1="50" x2="64" y2="50" stroke="#f5a623" stroke-width="2" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="50" y1="82" x2="50" y2="64" stroke="#50e3c2" stroke-width="2" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="18" y1="50" x2="36" y2="50" stroke="#d0021b" stroke-width="2" stroke-dasharray="2 2" opacity="0.6"/>
  
  <!-- Узлы-модели (Члены совета) -->
  <!-- Верхняя (Синяя - основная) -->
  <circle cx="50" cy="18" r="8" fill="#ffffff" stroke="#4a90e2" stroke-width="3"/>
  <circle cx="50" cy="18" r="3" fill="#4a90e2"/>
  
  <!-- Правая (Оранжевая) -->
  <circle cx="82" cy="50" r="8" fill="#ffffff" stroke="#f5a623" stroke-width="3"/>
  <circle cx="82" cy="50" r="3" fill="#f5a623"/>
  
  <!-- Нижняя (Бирюзовая) -->
  <circle cx="50" cy="82" r="8" fill="#ffffff" stroke="#50e3c2" stroke-width="3"/>
  <circle cx="50" cy="82" r="3" fill="#50e3c2"/>
  
  <!-- Левая (Красная) -->
  <circle cx="18" cy="50" r="8" fill="#ffffff" stroke="#d0021b" stroke-width="3"/>
  <circle cx="18" cy="50" r="3" fill="#d0021b"/>
  
  <!-- Центр (Председатель / Синтез решения) -->
  <circle cx="50" cy="50" r="14" fill="#f8fafc" stroke="#4a90e2" stroke-width="3"/>
  
  <!-- Галочка консенсуса в центре (цвета председателя) -->
  <path d="M 45 50.5 L 48.5 54 L 56 46" stroke="#4a90e2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>