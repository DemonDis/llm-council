<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Темный современный фон -->
  <rect width="100" height="100" rx="22" fill="#0f172a"/>
  
  <!-- Орбита обсуждения (внешнее кольцо) -->
  <circle cx="50" cy="50" r="32" stroke="#1e293b" stroke-width="3" fill="none"/>
  
  <!-- Линии связи к центру (передача мыслей/данных) -->
  <line x1="50" y1="18" x2="50" y2="36" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" opacity="0.8"/>
  <line x1="82" y1="50" x2="64" y2="50" stroke="#a78bfa" stroke-width="2" stroke-dasharray="2 2" opacity="0.8"/>
  <line x1="50" y1="82" x2="50" y2="64" stroke="#34d399" stroke-width="2" stroke-dasharray="2 2" opacity="0.8"/>
  <line x1="18" y1="50" x2="36" y2="50" stroke="#f472b6" stroke-width="2" stroke-dasharray="2 2" opacity="0.8"/>
  
  <!-- Узлы-модели (Члены совета) -->
  <!-- Верхняя (Голубая) -->
  <circle cx="50" cy="18" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="50" cy="18" r="3" fill="#38bdf8"/>
  
  <!-- Правая (Фиолетовая) -->
  <circle cx="82" cy="50" r="8" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="82" cy="50" r="3" fill="#a78bfa"/>
  
  <!-- Нижняя (Изумрудная) -->
  <circle cx="50" cy="82" r="8" fill="#0f172a" stroke="#34d399" stroke-width="3"/>
  <circle cx="50" cy="82" r="3" fill="#34d399"/>
  
  <!-- Левая (Розовая) -->
  <circle cx="18" cy="50" r="8" fill="#0f172a" stroke="#f472b6" stroke-width="3"/>
  <circle cx="18" cy="50" r="3" fill="#f472b6"/>
  
  <!-- Центр (Председатель / Синтез решения) -->
  <circle cx="50" cy="50" r="14" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
  
  <!-- Галочка консенсуса в центре -->
  <path d="M 45 50.5 L 48.5 54 L 56 46" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>